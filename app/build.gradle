plugins { id 'com.android.application' }

android {
    namespace 'br.com.trilha.foco'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.trilha.foco'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('ONEO_KEYSTORE_PATH') ?: 'release-not-configured.p12')
            storePassword System.getenv('ONEO_STORE_PASSWORD') ?: ''
            keyAlias 'oneo'
            keyPassword System.getenv('ONEO_STORE_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
