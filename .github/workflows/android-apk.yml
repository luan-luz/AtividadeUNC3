name: Gerar APK Android
on:
  push:
    branches: [main, trilha-android-nativo, 'feature/desafios-1o-v1-2', 'feature/atualizacao-github-v1-3']
  workflow_dispatch:
concurrency:
  group: oneo-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Localizar e preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado em $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Usando $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK nativo
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle :app:assembleDebug --no-daemon --stacktrace; then exit 0; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Falha na compilação ou nos downloads. Tentativa $((attempt+1))/3 após pausa."
            sleep 35
          done
      - name: Testar assinatura de release sem expor a chave permanente
        shell: bash
        run: |
          set -euo pipefail
          export ONEO_STORE_PASSWORD="apenas-para-teste-ci-nunca-distribuir"
          export ONEO_KEYSTORE_PATH="$RUNNER_TEMP/test-only.p12"
          keytool -genkeypair -keystore "$ONEO_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$ONEO_STORE_PASSWORD" -keypass "$ONEO_STORE_PASSWORD" \
            -alias oneo -keyalg RSA -keysize 2048 -validity 3 \
            -dname "CN=1o CI Temporary" >/dev/null 2>&1
          gradle :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          rm -f "$ONEO_KEYSTORE_PATH"
      - name: Publicar APK instalável
        uses: actions/upload-artifact@v4
        with:
          name: 1o-DEBUG-TESTE-NAO-INSTALAR
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
