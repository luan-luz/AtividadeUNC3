name: Gerar APK Android
on:
  push:
    branches: [trilha-android-nativo]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK nativo
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK instalável
        uses: actions/upload-artifact@v4
        with:
          name: TRILHA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
