name: Publicar atualização 1o
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/release-1o.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ONEO_KEYSTORE_B64: ${{ secrets.ONEO_KEYSTORE_B64 }}
      ONEO_STORE_PASSWORD: ${{ secrets.ONEO_STORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Validar segredos de assinatura
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ONEO_KEYSTORE_B64" || -z "$ONEO_STORE_PASSWORD" ]]; then
            echo "::error::Configure ONEO_KEYSTORE_B64 e ONEO_STORE_PASSWORD nos segredos do repositório."
            exit 1
          fi
          printf '%s' "$ONEO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/1o-release.p12"
          chmod 600 "$RUNNER_TEMP/1o-release.p12"
          echo "ONEO_KEYSTORE_PATH=$RUNNER_TEMP/1o-release.p12" >> "$GITHUB_ENV"
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validar versão de release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName inválida"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::A release v$VERSION já existe. Atualize versionCode e versionName antes de publicar."
            exit 1
          fi
      - name: Compilar APK de produção assinado
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle :app:assembleRelease --no-daemon; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 35
          done
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/1o.apk
      - name: Publicar no GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" dist/1o.apk --target "$GITHUB_SHA" --title "1o ${{ steps.version.outputs.tag }}" --generate-notes
      - name: Limpar material de assinatura
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/1o-release.p12"
